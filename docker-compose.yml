name: sarb

# Phase 6: every service is dockerized - `docker compose up` brings the whole
# stack up together. JWT_SECRET and ANTHROPIC_API_KEY come from a root .env
# file (see .env.example) that docker-compose reads automatically for ${VAR}
# substitution below - separate from each service's own gitignored .env used
# by DotenvEnvironmentPostProcessor when running via `mvnw spring-boot:run`
# on the host instead. Each app service loads an application-docker.properties
# profile (SPRING_PROFILES_ACTIVE=docker) that overrides the localhost-port
# defaults with container-network hostnames (postgres:5432, kafka:29092,
# service names for gateway's routes). Ollama isn't dockerized (it's a local
# brew install, not part of this project's own services), so rag-service
# reaches it via Docker Desktop's host.docker.internal instead.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sarb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sarb
      POSTGRES_USER: sarb
      POSTGRES_PASSWORD: sarb
    ports:
      # Host port 5433 (not 5432) because a native Postgres is already
      # running on the host on 5432. Container-internal port stays 5432.
      - "5433:5432"
    volumes:
      - sarb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarb -d sarb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:latest
    container_name: sarb-kafka
    restart: unless-stopped
    ports:
      # Host-facing listener (Java services running locally via Maven connect here).
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: in-Docker-network listener (used by kafka-ui and, from Phase 6, dockerized services).
      # PLAINTEXT_HOST: host-facing listener (used by services running on the host via Maven/npm).
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sarb-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sarb
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  auth-service:
    build: ./auth-service
    container_name: sarb-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}

  gateway:
    build: ./gateway
    container_name: sarb-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - alert-service
      - mission-service
      - rag-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}

  simulator-service:
    build: ./simulator-service
    container_name: sarb-simulator-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  telemetry-service:
    build: ./telemetry-service
    container_name: sarb-telemetry-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}

  alert-service:
    build: ./alert-service
    container_name: sarb-alert-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  mission-service:
    build: ./mission-service
    container_name: sarb-mission-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  rag-service:
    build: ./rag-service
    container_name: sarb-rag-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

  frontend:
    build: ./frontend
    container_name: sarb-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "5173:80"

volumes:
  sarb-postgres-data:
