server.port=8083
spring.application.name=telemetry-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

sarb.cors.allowed-origin=http://localhost:5173

# Postgres (docker-compose maps the container's 5432 to host 5433). Shares the
# physical "sarb" database with alert-service but owns its own schema
# ("telemetry") so their Flyway histories and tables never collide.
spring.datasource.url=jdbc:postgresql://localhost:5433/sarb?currentSchema=telemetry
spring.datasource.username=sarb
spring.datasource.password=sarb
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=telemetry
spring.flyway.enabled=true
spring.flyway.schemas=telemetry
spring.flyway.default-schema=telemetry

# Kafka: consumes drone.telemetry (writes flight logs + pushes to /topic/telemetry),
# drone.alerts (relays to /topic/alerts - alert-service owns persistence), and
# mission.events (relays to /topic/missions - mission-service owns persistence).
# Producers disable __TypeId__ headers, so each listener pins its own default
# type instead of trusting a header naming a class from another service's package.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=telemetry-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dronefleet.telemetry.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

sarb.kafka.topics.telemetry=drone.telemetry
sarb.kafka.topics.alerts=drone.alerts
sarb.kafka.topics.missions=mission.events
