server.port=8080
spring.application.name=gateway
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

sarb.cors.allowed-origin=http://localhost:5173

# JWT_SECRET is loaded from the gitignored .env file (see .env.example) via
# DotenvEnvironmentPostProcessor - must match auth-service's .env exactly,
# since auth-service signs tokens with it and this service only verifies.
sarb.jwt.secret=${JWT_SECRET}

sarb.services.auth-service=http://localhost:8081
sarb.services.alert-service=http://localhost:8084
sarb.services.mission-service=http://localhost:8085
sarb.services.rag-service=http://localhost:8086
