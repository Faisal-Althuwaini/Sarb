server.port=8086
spring.application.name=rag-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

sarb.cors.allowed-origin=http://localhost:5173

# Postgres (docker-compose maps the container's 5432 to host 5433). Shares the
# physical "sarb" database with the other services but owns its own schema
# ("rag") - just the pgvector-managed vector_store table, no Flyway/JPA here.
spring.datasource.url=jdbc:postgresql://localhost:5433/sarb?currentSchema=rag,public
spring.datasource.username=sarb
spring.datasource.password=sarb

# Chat model: Claude (Anthropic). Key must be set via the ANTHROPIC_API_KEY
# env var - never committed here.
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-5

# Embedding model: Ollama running locally with bge-m3 (1024-dim, strong
# multilingual/Arabic support - the corpus mixes English GACAR text with
# Arabic SOPs, and questions arrive in Arabic).
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=bge-m3

# Vector store: pgvector, schema "rag" (created manually - PgVectorStore only
# creates the table, not the schema). Dimensions must match bge-m3's output.
spring.ai.vectorstore.pgvector.schema-name=rag
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

sarb.rag.corpus.regulations-location=classpath:corpus/regulations/*.pdf
sarb.rag.corpus.sops-location=classpath:corpus/sops/*.txt
