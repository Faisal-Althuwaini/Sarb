# Overrides for docker-compose: container-to-container hostname for Postgres;
# Ollama isn't dockerized (brew-installed on the host), so it's reached via
# Docker Desktop's host.docker.internal instead of localhost.
spring.datasource.url=jdbc:postgresql://postgres:5432/sarb?currentSchema=rag,public
spring.ai.ollama.base-url=http://host.docker.internal:11434
