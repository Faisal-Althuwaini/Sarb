server.port=8081
spring.application.name=auth-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.datasource.url=jdbc:postgresql://localhost:5433/sarb?currentSchema=auth
spring.datasource.username=sarb
spring.datasource.password=sarb
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=auth

spring.flyway.enabled=true
spring.flyway.schemas=auth
spring.flyway.default-schema=auth

# JWT_SECRET is loaded from the gitignored .env file (see .env.example) via
# DotenvEnvironmentPostProcessor. The gateway holds the same secret in its
# own .env to validate tokens this service issues.
sarb.jwt.secret=${JWT_SECRET}
sarb.jwt.expiration-minutes=1440
