server.port=8084
spring.application.name=alert-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

sarb.cors.allowed-origin=http://localhost:5173

# Postgres (docker-compose maps the container's 5432 to host 5433). Shares the
# physical "sarb" database with telemetry-service but owns its own schema
# ("alert") so their Flyway histories and tables never collide.
spring.datasource.url=jdbc:postgresql://localhost:5433/sarb?currentSchema=alert
spring.datasource.username=sarb
spring.datasource.password=sarb
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=alert
spring.flyway.enabled=true
spring.flyway.schemas=alert
spring.flyway.default-schema=alert

# Alert rule thresholds (brief Section 7).
sarb.alert.low-battery-pct=25
sarb.alert.critical-battery-pct=8
sarb.alert.max-altitude-m=120

# Geofence circle - mirrors simulator-service's own center/radius so drones
# only alert once genuinely adrift. Duplicated deliberately: alert-service is
# independently deployable and shouldn't read another service's config.
sarb.geofence.center-lat=24.71
sarb.geofence.center-lon=46.68
sarb.geofence.radius-km=5.0

# Kafka: consumes drone.telemetry, produces drone.alerts.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=alert-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dronefleet.alert.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

sarb.kafka.topics.telemetry=drone.telemetry
sarb.kafka.topics.alerts=drone.alerts
