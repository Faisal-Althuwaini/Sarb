server.port=8085
spring.application.name=mission-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

sarb.cors.allowed-origin=http://localhost:5173

spring.datasource.url=jdbc:postgresql://localhost:5433/sarb?currentSchema=mission
spring.datasource.username=sarb
spring.datasource.password=sarb
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=mission

spring.flyway.enabled=true
spring.flyway.schemas=mission
spring.flyway.default-schema=mission

# Kafka (Phase 4): mission-service produces ASSIGNED/CANCELLED events and
# also consumes its own topic for the STARTED/COMPLETED events that
# simulator-service publishes back once it actually flies a mission.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=mission-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dronefleet.mission.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

sarb.kafka.topics.missions=mission.events
