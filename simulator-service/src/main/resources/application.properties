server.port=8082
spring.application.name=simulator-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Fleet simulation tunables (brief Section 8) - crank drone-count/tick-ms up
# to demo the system under load.
sarb.simulator.drone-count=12
sarb.simulator.tick-ms=400
sarb.simulator.center-lat=24.71
sarb.simulator.center-lon=46.68
sarb.simulator.spread-radius-km=5.0

# Kafka (Phase 3): simulator-service is a producer only, one message per
# drone per tick, keyed by droneId so per-drone ordering is preserved.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Don't stamp __TypeId__ headers with this service's package name - consumers
# live in different services/packages and would fail to resolve the type.
# Each consumer sets its own default type instead (see their application.properties).
spring.kafka.producer.properties.spring.json.add.type.headers=false

sarb.kafka.topics.telemetry=drone.telemetry
