server.port=8082
spring.application.name=simulator-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Fleet simulation tunables (brief Section 8) - crank drone-count/tick-ms up
# to demo the system under load.
sarb.simulator.drone-count=12
sarb.simulator.tick-ms=400
sarb.simulator.center-lat=24.71
sarb.simulator.center-lon=46.68
sarb.simulator.spread-radius-km=5.0

sarb.cors.allowed-origin=http://localhost:5173

# Postgres (docker-compose maps the container's 5432 to host 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/sarb
spring.datasource.username=sarb
spring.datasource.password=sarb
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Alert rule thresholds (brief Section 7) - geofence circle reuses the
# simulator's own center/radius so drones only alert once genuinely adrift.
sarb.alert.low-battery-pct=25
sarb.alert.critical-battery-pct=8
sarb.alert.max-altitude-m=120
